services:
  cloudflare:
    build:
      context: ${cloudflare_DDDC}
      dockerfile: Dockerfile
    image: cloudflare/cloudflared:dashboard
    init: true
    restart: always
    environment:
      UUID: ${UUID}
    volumes:
      - ./tunnel:/var/cloudflared
    entrypoint:
      - /opt/startup
    command:
      - --post-quantum
      - tunnel
      - run
      - ${CLOUDFLARE_DOMAIN_ID}
